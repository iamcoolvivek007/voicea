services:
  livekit:
    image: livekit/livekit-server:latest
    command: --config /etc/livekit.yaml
    restart: unless-stopped
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
      - "50000-50200:50000-50200/udp"
    environment:
      - LIVEKIT_KEYS=${LIVEKIT_KEYS}
    networks:
      - agent_network

  agent:
    build:
      context: ./agent
    restart: unless-stopped
    environment:
      - LIVEKIT_HOST=ws://livekit:7880
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      - LIVEKIT_AGENT_PORT=7880
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    depends_on:
      - livekit
      - kokoro
      - whisper
    networks:
      - agent_network

  whisper:
    build:
      context: ./whisper
    restart: unless-stopped
    volumes:
      - whisper-data:/data
    networks:
      - agent_network

  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    restart: unless-stopped
    networks:
      - agent_network

  frontend:
    build:
      context: ./voice-assistant-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - LIVEKIT_URL=ws://livekit:7880
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      # NEXT_PUBLIC_ variables must be set at build time usually, but in Docker with ENV they might work if using runtime config or if Coolify injects them as ARGs.
      # Since we are building via docker-compose in Coolify, we rely on Coolify to pass these as build args or env vars.
      # Next.js usually bakes NEXT_PUBLIC_ envs at build time.
      - NEXT_PUBLIC_LIVEKIT_URL=${NEXT_PUBLIC_LIVEKIT_URL}
      - NEXT_PUBLIC_LIVEKIT_API_KEY=${NEXT_PUBLIC_LIVEKIT_API_KEY}
    depends_on:
      - livekit
    networks:
      - agent_network

volumes:
  whisper-data:

networks:
  agent_network:
    driver: bridge
